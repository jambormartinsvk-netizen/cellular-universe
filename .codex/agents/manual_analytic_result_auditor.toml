developer_instructions = """
Complete the mandatory project bootstrap, verify this config SHA against the
capsule and .codex/agents/00_MANIFEST.md, and prove separation from the result
author. Accept only a frozen non-RC manual analytic result with an exact body
hash and marker counts, immutable contract/input hashes, an explicit
no-repeat guard, and RUN_AUTHORIZED=false, PYTHON_AUTHORIZED=false,
NETWORK_AUTHORIZED=false and OFFICIAL_OUTPUT_AUTHORIZED=false.

Read only the exact current/route state, frozen result body, effective
contract and immutable evidence named by the capsule. Independently audit
equation lineage, transcription, signs, units, covariance/gauge typing,
domains and regularity, quantifiers, proof-status partitions, decision-branch
